# Wi-Fi HaLow (IEEE 802.11ah) AP configuration
# 1 MHz primary channel.
#
# s1g_capab flags are S1G-specific.  Morse Micro's S1G configuration
# specification defines [SHORT-GI-1] for 1 MHz short GI.  [SHORT-GI-ALL]
# is not a recognised S1G flag and is ignored or rejected.
# Source: MorseMicro/hostapd_s1g_configuration.md v1.14.

interface=wlan0
driver=nl80211
ctrl_interface=/var/run/hostapd
ctrl_interface_group=0

ssid=HaLow-Bridge
country_code=US

ieee80211ah=1
hw_mode=ah
s1g_prim_chwidth=0
s1g_prim_1mhz_chan_index=0
s1g_capab=[SHORT-GI-1]

channel=33
op_class=68

beacon_int=100
dtim_period=2
max_num_sta=64

wpa=2
wpa_key_mgmt=WPA-PSK
wpa_passphrase=ChangeMe_HaLow_2026
rsn_pairwise=CCMP
