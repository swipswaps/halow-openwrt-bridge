# Wi-Fi HaLow (IEEE 802.11ah) AP configuration, 1 MHz primary channel.
#
# s1g_capab=[SHORT-GI-ALL] is the specification default and matches the
# Gateworks GW16167 and GW16159 examples.
# hw_mode=ah is the S1G value from the upstream RFC.
#
# eapol_key_index_workaround=0 and own_ip_addr=127.0.0.1 are present in
# every Gateworks S1G AP example.  eapol_key_index_workaround controls
# the EAPOL-Key index bit that affects station-side CVE-2017-13087;
# own_ip_addr is the NAS-IP-Address used by RADIUS and accounting.
#
# wpa_passphrase must be replaced.  start-ap.sh rejects CHANGEME or empty.

interface=wlan0
driver=nl80211
ctrl_interface=/var/run/hostapd
ctrl_interface_group=0

ssid=HaLow-Bridge
country_code=US

ieee80211ah=1
hw_mode=ah
s1g_prim_chwidth=0
s1g_prim_1mhz_chan_index=0
s1g_capab=[SHORT-GI-ALL]

# Channel / operating class: US 1 MHz = 33/68; EU 1 MHz = 1/66
channel=33
op_class=68

beacon_int=100
dtim_period=2
max_num_sta=64

eapol_key_index_workaround=0
own_ip_addr=127.0.0.1

# WPA2-PSK
wpa=2
wpa_key_mgmt=WPA-PSK
wpa_passphrase=__CHANGEME__
rsn_pairwise=CCMP
