# Wi-Fi HaLow (IEEE 802.11ah) AP configuration
# 1 MHz primary channel, hw_mode=a (MANDATORY, not "ah")
#
# US 1 MHz example:
#   channel=33, op_class=68  (918.5 MHz)
#
# US 2 MHz example:
#   channel=10, op_class=69  (907 MHz)   (also set s1g_prim_chwidth=1)

interface=wlan0
driver=nl80211
ctrl_interface=/var/run/hostapd
ctrl_interface_group=0

ssid=HaLow-Bridge
country_code=US

# S1G / 802.11ah parameters
ieee80211ah=1
hw_mode=a
s1g_prim_chwidth=0
s1g_prim_1mhz_chan_index=0
s1g_capab=[SHORT-GI-ALL]

# Channel / operating class (US 1 MHz example)
channel=33
op_class=68

beacon_int=100
dtim_period=2
max_num_sta=64

# WPA2-PSK
wpa=2
wpa_key_mgmt=WPA-PSK
wpa_passphrase=ChangeMe_HaLow_2026
rsn_pairwise=CCMP
