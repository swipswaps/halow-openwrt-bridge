# Wi-Fi HaLow (IEEE 802.11ah) AP configuration
# 1 MHz primary channel.
#
# s1g_capab: the S1G configuration specification defines [SHORT-GI-1]
# through [SHORT-GI-16] and [SHORT-GI-ALL].  [SHORT-GI-ALL] is the
# spec default and enables SGI for the configured bandwidth including
# sub-bandwidths; [SHORT-GI-1] would enable SGI only at 1 MHz.
# Source: MorseMicro/hostapd_s1g_configuration.md v1.14, lines 42-61.
#
# hw_mode=ah is the S1G value added by the upstream RFC.  Some older
# Gateworks wiki examples still show hw_mode=a; use ah on any hostapd
# build that includes the S1G RFC.

interface=wlan0
driver=nl80211
ctrl_interface=/var/run/hostapd
ctrl_interface_group=0

ssid=HaLow-Bridge
country_code=US

ieee80211ah=1
hw_mode=ah
s1g_prim_chwidth=0
s1g_prim_1mhz_chan_index=0
s1g_capab=[SHORT-GI-ALL]

# US 1 MHz: channel=33, op_class=68
# EU 1 MHz: channel=1,  op_class=66
channel=33
op_class=68

beacon_int=100
dtim_period=2
max_num_sta=64

# WPA2-PSK
wpa=2
wpa_key_mgmt=WPA-PSK
wpa_passphrase=ChangeMe_HaLow_2026
rsn_pairwise=CCMP

# WPA3-SAE alternative: comment out the WPA2 block above and uncomment:
# wpa=2
# wpa_key_mgmt=SAE
# ieee80211w=2
# sae_pwe=2
# rsn_pairwise=CCMP
# sae_password=ChangeMe_HaLow_2026
